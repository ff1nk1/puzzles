name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << EOF > .env
          DB_HOST=database
          DB_PORT=5432
          DB_USER=ffink
          DB_PASS=1111
          DB_NAME=puzzles_site
          DATABASE_URL=postgresql+asyncpg://ffink:1111@database:5432/puzzles_site
          REDIS_HOST=redis
          MODE=DEV
          SECRET_KEY="CyhFX83gSKiOBAsErJcxwQ2IWIfnH7razpoqGSFicR0="
          EOF

      - name: Build and start services required for tests
        run: docker compose up -d --build database redis backend

      - name: Wait for database to be ready
        run: |
          for i in {1..30}; do
            if docker compose exec -T database pg_isready -U ffink; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Wait for backend to be ready
        run: sleep 10   # заменить на curl healthcheck если есть эндпоинт

      - name: Run tests
        run: docker compose exec -T backend pytest

      - name: Stop services
        if: always()
        run: docker compose down